<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; margin: 0; color: white; }
        .header { background-color: #5C0632; color: white; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: 50px auto; padding: 30px; background-color: #1e1e1e; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 4px; background-color: #333; color: white; box-sizing: border-box; }
        button { width: 100%; background-color: #5C0632; color: white; border: none; padding: 15px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #4a0528; }
        .link { text-align: center; margin-top: 15px; }
        .link a { color: #5C0632; text-decoration: none; font-weight: bold; }
        .flash { background-color: #d32f2f; color: white; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Smart Flights</h1>
    </div>
    <div class="container">
        <h2 style="text-align: center;">Register</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <div class="link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>
</body>
</html>
