<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Flights</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; margin: 0; color: white; }
        .header { background-color: #5C0632; color: white; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; background-color: #1e1e1e; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 4px; background-color: #333; color: white; box-sizing: border-box; }
        button { width: 100%; background-color: #5C0632; color: white; border: none; padding: 15px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #4a0528; }
        .flash { background-color: #d32f2f; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; }
        .nav { text-align: right; margin-bottom: 20px; }
        .nav a { color: #5C0632; text-decoration: none; margin-left: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Smart Flights</h1>
        <p>Fly better, connect the world.</p>
    </div>
    
    <div class="container">
        <div class="nav">
            {% if session.user_id %}
                <a href="/my-bookings">My Bookings</a>
                <a href="/logout">Logout</a>
            {% else %}
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            {% endif %}
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <h2>Book a Flight</h2>
        <form action="/search" method="POST">
            <div class="form-group">
                <label for="origin">From</label>
                <select id="origin" name="origin">
                    <option value="DOH">Doha (DOH)</option>
                    <option value="LHR">London (LHR)</option>
                    <option value="JFK">New York (JFK)</option>
                    <option value="CDG">Paris (CDG)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="destination">To</label>
                <select id="destination" name="destination">
                    <option value="LHR">London (LHR)</option>
                    <option value="JFK">New York (JFK)</option>
                    <option value="DOH">Doha (DOH)</option>
                    <option value="CDG">Paris (CDG)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Departure Date</label>
                <input type="date" id="date" name="date" min="{{ today }}">
                <div class="form-group">
    <label for="passengers">Passengers</label>
    <select id="passengers" name="passengers">
        <option value="1">1 Passenger</option>
        <option value="2">2 Passengers</option>
        <option value="3">3 Passengers</option>
        <option value="4">4 Passengers</option>
    </select>
</div>
            </div>
            <button type="submit">Search Flights</button>
        </form>
    </div>
</body>
</html>
